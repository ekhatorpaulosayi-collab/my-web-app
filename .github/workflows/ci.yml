name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit-and-axe:
    # ubuntu-latest is 26.04. Playwright 1.58.2 has no Chromium build for it,
    # so `playwright install --with-deps` fails before the axe tests run.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Working tree only. --no-git does not walk old commits (the leaked
      # database password is still in history and history must not be rewritten).
      # --redact keeps the secret out of the log if a future commit adds one.
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz" | tar -xz gitleaks
      - name: Secret scan
        run: ./gitleaks detect --no-git --source . --redact --config .gitleaks.toml --baseline-path .gitleaks-baseline.json --exit-code 1
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ux
        env:
          CI: 'true'
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-anon-key

  migrations:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: storehouse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply release migrations on a fresh database
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/storehouse
          PGPASSWORD: postgres
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          bash scripts/rehearse-migrations.sh
      - name: Database behaviour
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/storehouse
          PGPASSWORD: postgres
        run: npm run test:db
